<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio admin</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f27;--mute:#667085;--line:#e2e5ea;--accent:#1f4fd8;--danger:#c0392b;--ok:#1e7e4a}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e25;--ink:#e8eaee;--mute:#98a1b0;--line:#2b313b;--accent:#6d8dff;--danger:#ff7b6b;--ok:#4cc486}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:.45rem .9rem}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  input,textarea{font:inherit;width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{resize:vertical}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;padding:.6rem 1rem;background:var(--card);border-bottom:1px solid var(--line)}
  header nav{display:flex;flex-wrap:wrap;gap:.3rem}
  header nav button{background:transparent;color:var(--mute);border-color:transparent}
  header nav button.on{color:var(--ink);border-color:var(--line);font-weight:600}
  header .right{display:flex;gap:.6rem;align-items:center}
  #state{color:var(--mute);font-size:.85rem}
  main{max-width:900px;margin:1.2rem auto;padding:0 1rem 4rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
  .card h2,.card h3{margin:.1rem 0 .8rem}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.7rem}
  .bar span{display:flex;gap:.4rem}
  .bar button{padding:.25rem .6rem}
  .grid{display:grid;gap:.8rem}
  .two{grid-template-columns:1fr 1fr}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  label.f{display:grid;gap:.25rem}
  label.f>span{font-size:.82rem;color:var(--mute)}
  label.c{display:flex;gap:.5rem;align-items:center}
  label.c input{width:auto}
  .up{display:grid;gap:.4rem}
  .thumb{max-width:180px;max-height:120px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem}
  .stat b{display:block;font-size:1.7rem}
  .stat small{color:var(--mute)}
  .chart{display:flex;align-items:flex-end;gap:2px;height:120px}
  .chart i{flex:1;background:var(--accent);min-height:2px;border-radius:2px 2px 0 0;opacity:.85}
  table{width:100%;border-collapse:collapse}
  td,th{padding:.35rem .4rem;border-bottom:1px solid var(--line);text-align:left}
  td:last-child,th:last-child{text-align:right}
  .media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
  .media .m{border:1px solid var(--line);border-radius:10px;padding:.5rem;font-size:.8rem;word-break:break-all}
  .media img{width:100%;height:90px;object-fit:cover;border-radius:6px}
  .row{display:grid;grid-template-columns:1fr 2fr auto;gap:.5rem;align-items:end;margin-bottom:.5rem}
  .muted{color:var(--mute)}
  #login{max-width:340px;margin:18vh auto;padding:0 1rem}
  #toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,40px);opacity:0;transition:.25s;background:var(--ok);color:#fff;padding:.6rem 1rem;border-radius:8px;pointer-events:none}
  #toast.bad{background:var(--danger)}
  #toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h2>Admin sign in</h2>
    <form id="loginForm" class="grid">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button>Sign in</button>
      <small id="loginErr" style="color:var(--danger)"></small>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <nav id="tabs"></nav>
    <div class="right">
      <span id="state"></span>
      <button id="save" disabled>Save &amp; publish</button>
      <button id="logout" class="ghost">Sign out</button>
    </div>
  </header>
  <main id="panel"></main>
</div>
<div id="toast"></div>

<script>
const $ = (s, e = document) => e.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const btn = (label, fn, cls = '') => h('button', { type: 'button', class: cls, onclick: fn }, label);

let site = null, tab = 'metrics', unsaved = false;
const TABS = [['metrics', 'Metrics'], ['profile', 'Profile'], ['experience', 'Experience'], ['education', 'Education'],
              ['skills', 'Skills'], ['projects', 'Projects'], ['media', 'Media']];

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad show' : 'show';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3500);
}
async function api(path, opts = {}) {
  const headers = { 'X-Requested-With': 'admin', ...(opts.headers || {}) };
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, { credentials: 'same-origin', ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error(data.detail || 'Not signed in'); }
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Request failed (' + r.status + ')');
  return data;
}
const get = (o, p) => p.reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { get(o, p.slice(0, -1))[p[p.length - 1]] = v; dirty(); };
function dirty() { unsaved = true; $('#state').textContent = 'Unsaved changes'; $('#save').disabled = false; }
function normalise(s) {
  s.site ??= {}; s.hero ??= {}; s.about ??= ''; s.stats ??= []; s.experience ??= []; s.education ??= [];
  s.certifications ??= []; s.projects ??= []; s.contact ??= {};
  s.skills ??= {}; for (const k of ['technical', 'academic', 'soft']) s.skills[k] ??= [];
  return s;
}

/* ---------- form builders ---------- */
const CSV = { to: v => (v || []).join(', '), from: v => v.split(',').map(s => s.trim()).filter(Boolean) };
const LINES = { to: v => (v || []).join('\n'), from: v => v.split('\n').map(s => s.trim()).filter(Boolean) };

function field(label, path, o = {}) {
  const conv = o.as === 'csv' ? CSV : o.as === 'lines' ? LINES : null;
  const raw = get(site, path);
  const el = o.rows ? h('textarea', { rows: o.rows }) : h('input', { type: o.type || 'text', placeholder: o.placeholder || '' });
  el.value = conv ? conv.to(raw) : (raw ?? '');
  el.addEventListener('input', () => set(site, path, conv ? conv.from(el.value) : el.value));
  return h('label', { class: 'f' }, h('span', {}, label), el);
}
function check(label, path) {
  const el = h('input', { type: 'checkbox' });
  el.checked = !!get(site, path);
  el.addEventListener('change', () => set(site, path, el.checked));
  return h('label', { class: 'c' }, el, label);
}
async function upload(file) {
  const fd = new FormData(); fd.append('file', file);
  return api('/api/admin/upload', { method: 'POST', body: fd });
}
function uploader(label, path, accept) {
  const box = field(label, path, { placeholder: '/uploads/… or https://…' });
  const file = h('input', { type: 'file', accept });
  file.addEventListener('change', async () => {
    if (!file.files[0]) return;
    try { toast('Uploading…'); const r = await upload(file.files[0]); set(site, path, r.url); toast('Uploaded'); render(); }
    catch (e) { toast(e.message, true); }
  });
  const v = get(site, path);
  return h('div', { class: 'up' }, box,
    v && /\.(png|jpe?g|webp|gif)$/i.test(v) ? h('img', { src: v, class: 'thumb', alt: '' }) : null, file);
}
function move(arr, i, d) {
  const j = i + d; if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; dirty(); render();
}
function listEditor(path, makeItem, title, body, addLabel) {
  const arr = get(site, path);
  const wrap = h('div');
  arr.forEach((item, i) => {
    wrap.append(h('div', { class: 'card' },
      h('div', { class: 'bar' }, h('strong', {}, title(item, i)),
        h('span', {}, btn('↑', () => move(arr, i, -1), 'ghost'), btn('↓', () => move(arr, i, 1), 'ghost'),
          btn('Delete', () => { if (confirm('Delete this entry?')) { arr.splice(i, 1); dirty(); render(); } }, 'danger'))),
      body([...path, i], item)));
  });
  wrap.append(btn(addLabel, () => { arr.push(makeItem()); dirty(); render(); }));
  return wrap;
}
const card = (title, ...kids) => h('div', { class: 'card' }, h('h3', {}, title), h('div', { class: 'grid' }, ...kids));

/* ---------- tabs ---------- */
function vProfile(p) {
  p.append(
    card('Hero (top of the home page)',
      h('div', { class: 'grid two' }, field('Full name', ['hero', 'name']), field('Short name (navigation bar)', ['hero', 'short_name'])),
      field('Role / job title', ['hero', 'role']),
      field('Status pill (green dot), e.g. "Open to graduate roles"', ['hero', 'availability']),
      field('Headline', ['hero', 'headline'], { rows: 3 }),
      field('Intro paragraph', ['hero', 'intro'], { rows: 4 }),
      uploader('Hero photo (cut-out PNG/WebP works best)', ['hero', 'photo'], 'image/*'),
      uploader('CV (PDF) — the Download CV button serves this file', ['hero', 'cv_url'], 'application/pdf')),
    card('Numbers row',
      listEditor(['stats'], () => ({ value: '', label: '' }), (x, i) => (x.value || '') + ' ' + (x.label || ''),
        path => h('div', { class: 'grid two' }, field('Value', [...path, 'value']), field('Label', [...path, 'label'])),
        '+ Add number')),
    card('About page', field('About text (blank line = new paragraph)', ['about'], { rows: 9 })),
    card('Contact & social',
      field('Heading above the contact buttons', ['contact', 'cta_heading']),
      h('div', { class: 'grid two' },
        field('Email', ['contact', 'email'], { type: 'email' }), field('Phone', ['contact', 'phone']),
        field('WhatsApp link', ['contact', 'whatsapp'], { placeholder: 'https://wa.me/27…' }),
        field('Location', ['contact', 'location']),
        field('GitHub URL', ['contact', 'github']), field('LinkedIn URL', ['contact', 'linkedin']),
        field('Instagram URL', ['contact', 'instagram']), field('Facebook URL', ['contact', 'facebook'])),
      field('Contact form endpoint (Formspree URL)', ['contact', 'form_action'])),
    card('Search & sharing',
      field('Browser/Google title', ['site', 'title']),
      field('Description (Google and link previews)', ['site', 'description'], { rows: 3 }),
      field('Blog URL (adds a Blog link to the menu)', ['site', 'blog_url']),
      field('Hosting region shown in the Privacy Policy (e.g. Cape Town, South Africa)', ['site', 'hosting_region']),
      field('Google Search Console verification token', ['site', 'google_verification'])));
}
function vExperience(p) {
  p.append(card('Section statement (home page)', field('Short statement above the experience cards', ['experience_intro'], { rows: 3 })));
  p.append(listEditor(['experience'], () => ({ role: '', org: '', dates: '', bullets: [] }),
    (e, i) => e.role || 'Entry ' + (i + 1),
    path => h('div', { class: 'grid' },
      h('div', { class: 'grid two' }, field('Role', [...path, 'role']), field('Organisation', [...path, 'org'])),
      field('Dates', [...path, 'dates']),
      field('Achievements (one per line)', [...path, 'bullets'], { rows: 5, as: 'lines' })),
    '+ Add experience'));
}
function vEducation(p) {
  p.append(listEditor(['education'], () => ({ degree: '', school: '', dates: '', bullets: [] }),
    (e, i) => e.degree || 'Entry ' + (i + 1),
    path => h('div', { class: 'grid' },
      field('Qualification', [...path, 'degree']),
      h('div', { class: 'grid two' }, field('Institution', [...path, 'school']), field('Dates', [...path, 'dates'])),
      field('Details (one per line)', [...path, 'bullets'], { rows: 5, as: 'lines' })),
    '+ Add education'));
  p.append(card('Certifications', field('One per line', ['certifications'], { rows: 6, as: 'lines' })));
}
function vSkills(p) {
  p.append(card('Home page statement', field('Short statement above the skills cards', ['skills_intro'], { rows: 3 })));
  p.append(card('Skills',
    field('Technical (comma separated)', ['skills', 'technical'], { as: 'csv' }),
    field('Academic (comma separated)', ['skills', 'academic'], { as: 'csv' }),
    field('Soft (comma separated)', ['skills', 'soft'], { as: 'csv' })));
}
function filesEditor(path) {
  const files = get(site, [...path, 'files']);
  const wrap = h('div', { class: 'grid' }, h('strong', {}, 'Downloadable files'));
  files.forEach((f, i) => wrap.append(h('div', { class: 'row' },
    field('Label', [...path, 'files', i, 'name']), field('URL', [...path, 'files', i, 'url']),
    btn('Remove', () => { files.splice(i, 1); dirty(); render(); }, 'danger'))));
  const input = h('input', { type: 'file', multiple: true });
  input.addEventListener('change', async () => {
    try {
      for (const f of input.files) { toast('Uploading ' + f.name + '…'); const r = await upload(f); files.push({ name: f.name, url: r.url }); }
      dirty(); toast('Uploaded'); render();
    } catch (e) { toast(e.message, true); }
  });
  wrap.append(h('label', { class: 'f' }, h('span', {}, 'Upload files (PDF, ZIP, DOCX, XLSX, PPTX, images…)'), input));
  return wrap;
}
function vProjects(p) {
  p.append(listEditor(['projects'],
    () => ({ id: 'project-' + Date.now().toString(36), title: '', summary: '', content: '', url: '', repo_url: '',
             thumbnail: '', contain: false, tags: [], files: [], featured: false, visible: true }),
    (e, i) => (e.title || 'Untitled project') + (e.visible === false ? ' (hidden)' : ''),
    path => h('div', { class: 'grid' },
      h('div', { class: 'grid two' }, field('Title', [...path, 'title']), field('URL slug (page: /works/…)', [...path, 'id'])),
      field('Card summary (1–2 sentences)', [...path, 'summary'], { rows: 2 }),
      field('Full description (Markdown)', [...path, 'content'], { rows: 10 }),
      h('div', { class: 'grid two' },
        field('Project link (https://… or /page)', [...path, 'url'], { placeholder: 'https://…' }),
        field('Repository URL', [...path, 'repo_url'], { placeholder: 'https://github.com/…' })),
      uploader('Thumbnail', [...path, 'thumbnail'], 'image/*'),
      field('Tags (comma separated)', [...path, 'tags'], { as: 'csv' }),
      h('div', { class: 'grid two' }, check('Show on site', [...path, 'visible']), check('Featured on the home page', [...path, 'featured'])),
      check('Show the whole image (no cropping) — best for diagrams and charts', [...path, 'contain']),
      filesEditor(path)),
    '+ Add project'));
}
async function vMetrics(p) {
  p.append(h('p', { class: 'muted' }, 'Loading…'));
  const m = await api('/api/admin/metrics?days=30');
  const t = m.totals || {};
  const names = Object.fromEntries(site.projects.map(x => [x.id, x.title || x.id]));
  const stat = (n, l) => h('div', { class: 'card stat' }, h('b', {}, String(n ?? 0)), h('small', {}, l));
  const max = Math.max(1, ...m.daily.map(d => d.c));
  const table = (title, rows, label = x => x) => h('div', { class: 'card' }, h('h3', {}, title),
    rows.length ? h('table', {}, rows.map(r => h('tr', {}, h('td', {}, label(r.k)), h('td', {}, String(r.c)))))
                : h('p', { class: 'muted' }, 'No data yet.'));
  p.replaceChildren(
    h('p', { class: 'muted' }, 'Last 30 days. Visitors are counted once per day from an anonymous rotating hash; no IP addresses are stored.'),
    h('div', { class: 'stats' }, stat(t.pageview, 'Page views'), stat(m.visitors, 'Daily-unique visitors'),
      stat(t.cv_download, 'CV downloads'), stat(t.project_view, 'Project views')),
    h('div', { class: 'card' }, h('h3', {}, 'Page views per day'),
      m.daily.length ? h('div', { class: 'chart' }, m.daily.map(d => h('i', { style: `height:${Math.round(d.c / max * 100)}%`, title: `${d.d}: ${d.c}` })))
                     : h('p', { class: 'muted' }, 'No data yet.')),
    h('div', { class: 'grid two' }, table('Top referrers', m.referrers), table('Devices', m.devices)),
    table('Most-opened projects', m.projects, k => names[k] || k));
}
async function vMedia(p) {
  const input = h('input', { type: 'file', multiple: true });
  input.addEventListener('change', async () => {
    try { for (const f of input.files) { toast('Uploading ' + f.name + '…'); await upload(f); } toast('Uploaded'); render(); }
    catch (e) { toast(e.message, true); }
  });
  p.append(h('div', { class: 'card' }, h('h3', {}, 'Upload'), input));
  const list = await api('/api/admin/uploads');
  const grid = h('div', { class: 'media' });
  list.forEach(f => grid.append(h('div', { class: 'm' },
    f.folder === 'images' ? h('img', { src: f.url, alt: '', loading: 'lazy' }) : h('div', { class: 'muted' }, 'File'),
    h('div', {}, f.name), h('small', { class: 'muted' }, (f.size / 1024).toFixed(0) + ' KB'),
    h('div', { class: 'bar' },
      btn('Copy URL', async () => { await navigator.clipboard.writeText(f.url); toast('Copied ' + f.url); }, 'ghost'),
      btn('Delete', async () => {
        if (!confirm('Delete ' + f.name + '? Pages that use it will show a broken link.')) return;
        try { await api(`/api/admin/upload/${f.folder}/${encodeURIComponent(f.name)}`, { method: 'DELETE' }); toast('Deleted'); render(); }
        catch (e) { toast(e.message, true); }
      }, 'danger')))));
  p.append(h('div', { class: 'card' }, h('h3', {}, 'Library'), list.length ? grid : h('p', { class: 'muted' }, 'Nothing uploaded yet.')));
}

const VIEWS = { metrics: vMetrics, profile: vProfile, experience: vExperience, education: vEducation, skills: vSkills, projects: vProjects, media: vMedia };
async function view() {
  const p = $('#panel'); p.replaceChildren();
  try { await VIEWS[tab](p); } catch (e) { toast(e.message, true); }
}
function render() { const y = scrollY; view().then(() => scrollTo(0, y)); }
function showApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#tabs').replaceChildren(...TABS.map(([k, l]) => h('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; showApp(); } }, l)));
  view();
}
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pw').focus(); }

/* ---------- session ---------- */
async function boot() {
  try {
    await api('/api/admin/me');
    site = normalise(await (await fetch('/api/site')).json());
    showApp();
  } catch { showLogin(); }
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try { await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) }); $('#pw').value = ''; boot(); }
  catch (err) { $('#loginErr').textContent = err.message; }
});
$('#logout').onclick = async () => { try { await api('/api/admin/logout', { method: 'POST' }); } catch {} showLogin(); };
$('#save').onclick = async () => {
  try {
    $('#save').disabled = true; toast('Publishing…');
    await api('/api/admin/site', { method: 'PUT', body: JSON.stringify(site) });
    unsaved = false; $('#state').textContent = 'Published'; toast('Published to the site and GitHub');
  } catch (e) { toast(e.message, true); $('#save').disabled = false; }
};
addEventListener('beforeunload', e => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
</body>
</html>
