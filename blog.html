<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog – Aphiwe Mthembu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text',
                   'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .coming-soon-wrapper {
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 520px;
    }

    .profile-blog {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }

    .coming-soon-wrapper h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1d1d1f;
      margin-bottom: 0.75rem;
    }

    .coming-soon-wrapper p {
      font-size: 1rem;
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.6rem 1.35rem;
      background-color: #0071e3;
      color: #fff;
      text-decoration: none;
      border-radius: 980px;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .back-link:hover {
      background-color: #0077ed;
      transform: translateY(-1px);
    }

    .blog-badge {
      display: inline-block;
      background-color: #e8f4fd;
      color: #0071e3;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.85rem;
      border-radius: 980px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="coming-soon-wrapper">
    <img src="images/profile.jpg" alt="Aphiwe Elihle Mthembu" class="profile-blog"/>
    <span class="blog-badge">Coming Soon</span>
    <h1>Aphiwe's Blog</h1>
    <p>Articles, ideas, and engineering insights are on the way.<br>Stay tuned for updates.</p>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
  </div>
</body>
</html>
