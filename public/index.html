<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Engineering portfolio">
<style>
  :root{--bg:#fbfbfc;--card:#fff;--ink:#14181f;--mute:#5d6676;--line:#e4e7ec;--accent:#1f4fd8;--chip:#eef2ff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#171b22;--ink:#e9ecf1;--mute:#9aa3b2;--line:#272d37;--accent:#7c98ff;--chip:#1e2433}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:4rem}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 1.2rem}
  nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:1.1rem;flex-wrap:wrap;padding-top:.7rem;padding-bottom:.7rem}
  nav a{text-decoration:none;color:var(--mute);font-size:.95rem}
  nav a:hover{color:var(--ink)}
  .hero{display:flex;gap:2rem;align-items:center;padding:4.5rem 0 3rem;flex-wrap:wrap}
  .hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  .hero h1{margin:0;font-size:clamp(2rem,5vw,3rem);line-height:1.15}
  .hero p{margin:.6rem 0 1.2rem;color:var(--mute);max-width:36rem}
  .btn{display:inline-block;padding:.55rem 1.1rem;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;font-size:.95rem;margin:0 .5rem .5rem 0;cursor:pointer;font-family:inherit}
  .btn.alt{background:transparent;color:var(--accent)}
  section{padding:2.5rem 0;border-top:1px solid var(--line)}
  h2{margin:0 0 1.2rem;font-size:1.5rem}
  .exp{margin-bottom:1.4rem}
  .exp h3{margin:0;font-size:1.05rem}
  .exp .meta{color:var(--mute);font-size:.9rem}
  .exp ul{margin:.4rem 0 0;padding-left:1.2rem}
  .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
  .skills h3{margin:0 0 .5rem;font-size:.9rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;padding:.12rem .7rem;margin:0 .3rem .35rem 0;font-size:.85rem}
  .projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.2rem}
  .proj{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .proj img{width:100%;height:170px;object-fit:cover;display:block;background:var(--chip)}
  .proj .b{padding:1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
  .proj h3{margin:0;font-size:1.1rem}
  .proj p{margin:0;color:var(--mute);font-size:.95rem;flex:1}
  .proj .btn{padding:.35rem .8rem;font-size:.85rem;margin:0 .4rem 0 0}
  dialog{width:min(760px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg{padding:1.4rem}
  .dlg img.cover{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:1rem}
  .dlg .x{float:right}
  .md img{max-width:100%;border-radius:8px}
  .md pre{overflow:auto;background:var(--chip);padding:.8rem;border-radius:8px}
  .files li{margin:.25rem 0}
  .contact a{display:inline-block;margin-right:1.2rem}
  footer{padding:2rem 0 3rem;color:var(--mute);font-size:.9rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"><p style="padding:4rem 0;color:var(--mute)">Loading…</p></main>
<footer><div class="wrap" id="foot"></div></footer>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = (s, e = document) => e.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
// Only http(s), same-site paths, mailto and tel are ever used as links or image sources.
const safe = u => /^(https?:\/\/|\/(?!\/)|mailto:|tel:)/i.test(u || '') ? u : '';
function track(type, label = '') {
  try {
    const ref = document.referrer ? new URL(document.referrer).hostname : '';
    navigator.sendBeacon('/api/track', new Blob([JSON.stringify({
      type, path: location.pathname, ref: ref === location.hostname ? '' : ref, label })], { type: 'application/json' }));
  } catch {}
}
function markdown(md) {
  const box = h('div', { class: 'md' });
  if (window.marked && window.DOMPurify) box.innerHTML = DOMPurify.sanitize(marked.parse(md || ''));
  else box.textContent = md || '';
  return box;
}
if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', n => {
  if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
});
const link = (label, url, cls, onclick) => safe(url)
  ? h('a', { class: cls, href: safe(url), target: '_blank', rel: 'noopener noreferrer', onclick }, label) : null;

let site, projects = [];
function section(id, title, ...kids) { return h('section', { id }, h('h2', {}, title), ...kids); }

function openProject(p, push = true) {
  const d = $('#dlg');
  d.replaceChildren(h('div', { class: 'dlg' },
    h('button', { class: 'btn alt x', onclick: () => d.close() }, 'Close'),
    safe(p.thumbnail) ? h('img', { class: 'cover', src: safe(p.thumbnail), alt: '' }) : null,
    h('h2', {}, p.title),
    h('div', {}, (p.tags || []).map(t => h('span', { class: 'chip' }, t))),
    markdown(p.content),
    h('p', {}, link('Live site', p.url, 'btn', () => track('link_click', p.id)),
               link('Source code', p.repo_url, 'btn alt', () => track('link_click', p.id))),
    (p.files || []).length ? h('div', {}, h('h3', {}, 'Files'),
      h('ul', { class: 'files' }, p.files.map(f => safe(f.url) ? h('li', {}, link(f.name || f.url, f.url, '', () => track('link_click', p.id))) : null))) : null));
  d.showModal();
  if (push) { history.replaceState(null, '', '#project-' + p.id); track('project_view', p.id); }
}

function render(s) {
  site = s;
  const hero = s.hero || {}, c = s.contact || {};
  document.title = hero.name ? `${hero.name} — Portfolio` : 'Portfolio';
  projects = (s.projects || []).filter(p => p.visible !== false)
    .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  const main = $('#main'); main.replaceChildren();
  const nav = [];

  main.append(h('div', { class: 'hero' },
    safe(hero.photo) ? h('img', { src: safe(hero.photo), alt: hero.name || 'Profile photo' }) : null,
    h('div', {}, h('h1', {}, hero.name || ''), h('p', {}, hero.tagline || ''),
      link('Download CV', hero.cv_url, 'btn', () => track('cv_download')),
      h('a', { class: 'btn alt', href: '#contact' }, 'Get in touch'))));

  if ((s.about || '').trim()) {
    nav.push(['about', 'About']);
    main.append(section('about', 'About', ...s.about.split(/\n\s*\n/).map(t => h('p', {}, t))));
  }
  if ((s.experience || []).length) {
    nav.push(['experience', 'Experience']);
    main.append(section('experience', 'Experience', ...s.experience.map(e => h('div', { class: 'exp' },
      h('h3', {}, [e.role, e.org].filter(Boolean).join(' · ')), h('div', { class: 'meta' }, e.dates || ''),
      (e.bullets || []).length ? h('ul', {}, e.bullets.map(b => h('li', {}, b))) : null))));
  }
  const groups = [['technical', 'Technical'], ['academic', 'Academic'], ['soft', 'Soft skills']]
    .filter(([k]) => (s.skills?.[k] || []).length);
  if (groups.length) {
    nav.push(['skills', 'Skills']);
    main.append(section('skills', 'Skills', h('div', { class: 'skills' }, groups.map(([k, l]) =>
      h('div', {}, h('h3', {}, l), s.skills[k].map(x => h('span', { class: 'chip' }, x)))))));
  }
  if (projects.length) {
    nav.push(['projects', 'Projects']);
    main.append(section('projects', 'Projects', h('div', { class: 'projects' }, projects.map(p => h('article', { class: 'proj' },
      safe(p.thumbnail) ? h('img', { src: safe(p.thumbnail), alt: '', loading: 'lazy' }) : null,
      h('div', { class: 'b' }, h('h3', {}, p.title), h('p', {}, p.summary || ''),
        h('div', {}, (p.tags || []).map(t => h('span', { class: 'chip' }, t))),
        h('div', {}, h('button', { class: 'btn', onclick: () => openProject(p) }, 'Details'),
          link('Live', p.url, 'btn alt', () => track('link_click', p.id)),
          link('Code', p.repo_url, 'btn alt', () => track('link_click', p.id)))))))));
  }
  nav.push(['contact', 'Contact']);
  const email = c.email ? 'mailto:' + c.email : '';
  main.append(section('contact', 'Contact', h('div', { class: 'contact' },
    link(c.email, email, ''), link('WhatsApp', c.whatsapp, ''), link('GitHub', c.github, ''), link('LinkedIn', c.linkedin, ''),
    c.phone ? h('p', {}, c.phone) : null, c.location ? h('p', {}, c.location) : null)));

  $('#nav').replaceChildren(...nav.map(([id, l]) => h('a', { href: '#' + id }, l)));
  $('#foot').textContent = `© ${new Date().getFullYear()} ${hero.name || ''}`;

  const m = location.hash.match(/^#project-(.+)$/);                // deep link to one project
  const target = m && projects.find(p => p.id === decodeURIComponent(m[1]));
  if (target) openProject(target, false);
}

$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#dlg').addEventListener('close', () => { if (location.hash.startsWith('#project-')) history.replaceState(null, '', location.pathname); });

fetch('/api/site').then(r => r.json()).then(render).catch(() => {
  $('#main').replaceChildren(h('p', { style: 'padding:4rem 0' }, 'The site content could not be loaded. Please try again shortly.'));
});
track('pageview');
</script>
</body>
</html>
